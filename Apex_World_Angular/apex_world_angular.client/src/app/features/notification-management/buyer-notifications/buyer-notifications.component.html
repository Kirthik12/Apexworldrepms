<div class="notifications-page">
  <div class="n-header">
    <div class="n-header-left">
      <h2>Notifications History</h2>
      <p>Stay up to date with your property updates and payments.</p>
    </div>
    <button class="n-mark-all" (click)="markAllRead()">Mark all as read</button>
  </div>

  <div class="n-filters">
    <button *ngFor="let cat of categories" 
            class="n-filter-btn" 
            [class.active]="activeCategory === cat"
            (click)="setCategory(cat)">
      {{ cat }}
    </button>
  </div>

  <div class="n-list">
    <div *ngIf="notifications.length === 0" class="n-empty">
      No notifications found for this category.
    </div>
    
    <div class="n-card" 
         *ngFor="let n of notifications" 
         [class.unread]="!n.isRead"
         (click)="onNotificationClick(n)">
      <div [class]="getCategoryClass(n.category)">
        <span *ngIf="n.category === 'Booking'">📅</span>
        <span *ngIf="n.category === 'Payment'">💰</span>
        <span *ngIf="n.category === 'General'">📢</span>
      </div>
      <div class="n-card-content">
        <div class="n-card-title">{{ n.title }}</div>
        <div class="n-card-message">{{ n.message }}</div>
        <div class="n-card-time">{{ n.createdAt | date:'medium' }}</div>
      </div>
    </div>
  </div>

  <div class="n-pagination" *ngIf="totalItems > pageSize">
    <button (click)="prevPage()" [disabled]="pageNumber === 1">Previous</button>
    <span>Page {{ pageNumber }} of {{ Math.ceil(totalItems / pageSize) }}</span>
    <button (click)="nextPage()" [disabled]="pageNumber * pageSize >= totalItems">Next</button>
  </div>
</div>
