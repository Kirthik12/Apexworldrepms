name: ApexWorld Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'ApexWorld_Backend/**'
      - 'ApexWorld.Tests/**'
      - 'ApexWorld.UnitTests/**'
      - '.github/workflows/api-deploy.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'ApexWorld_Backend/**'
      - 'ApexWorld.Tests/**'
      - 'ApexWorld.UnitTests/**'
      - '.github/workflows/api-deploy.yaml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ApexWorld_Backend/ApexWorld_Backend/ApexWorld_Backend.csproj

      - name: Build
        run: dotnet build ApexWorld_Backend/ApexWorld_Backend/ApexWorld_Backend.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test ApexWorld.Tests/ApexWorld.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Test Unit Tests
        run: dotnet test ApexWorld.UnitTests/ApexWorld.UnitTests.csproj --configuration Release --logger "trx;LogFileName=unit-test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexworld-test-results
          path: |
            ApexWorld.Tests/TestResults/test-results.trx
            ApexWorld.UnitTests/TestResults/unit-test-results.trx
