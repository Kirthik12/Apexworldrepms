<div class="reset-pwd-container">
  <div class="reset-pwd-card">
    <div class="card-header">
      <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <div>
        <h2>Reset Password</h2>
        <p>Ensure your account is using a long, random password to stay secure.</p>
      </div>
    </div>
    
    <div class="card-body">
      <form id="admin-password-form" (ngSubmit)="onSubmit()" #pwdForm="ngForm">
          
          <div class="form-group">
              <label>Current Password <span class="required-star">*</span></label>
              <div class="input-wrapper">
                <input [type]="showCurrentPassword ? 'text' : 'password'" name="currentPassword" [(ngModel)]="currentPassword" #currentPasswordModel="ngModel" required [class.is-invalid-custom]="currentPasswordModel.invalid && (currentPasswordModel.dirty || currentPasswordModel.touched)" placeholder="Enter current password" class="modern-input">
                <button type="button" class="toggle-pwd-btn" (click)="toggleVisibility('current')">
                  {{ showCurrentPassword ? 'Hide' : 'Show' }}
                </button>
              </div>
              <div *ngIf="currentPasswordModel.invalid && (currentPasswordModel.dirty || currentPasswordModel.touched)" class="invalid-feedback-custom">Field is required</div>
          </div>
          
          <div class="form-group">
              <label>New Password <span class="required-star">*</span></label>
              <div class="input-wrapper">
                <input [type]="showNewPassword ? 'text' : 'password'" name="newPassword" [(ngModel)]="newPassword" #newPasswordModel="ngModel" required [class.is-invalid-custom]="newPasswordModel.invalid && (newPasswordModel.dirty || newPasswordModel.touched)" placeholder="Enter new password" class="modern-input">
                <button type="button" class="toggle-pwd-btn" (click)="toggleVisibility('new')">
                  {{ showNewPassword ? 'Hide' : 'Show' }}
                </button>
              </div>
              <div *ngIf="newPasswordModel.invalid && (newPasswordModel.dirty || newPasswordModel.touched)" class="invalid-feedback-custom">Field is required</div>
          </div>
          
          <div class="form-group">
              <label>Confirm New Password <span class="required-star">*</span></label>
              <div class="input-wrapper">
                <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" #confirmPasswordModel="ngModel" required [class.is-invalid-custom]="confirmPasswordModel.invalid && (confirmPasswordModel.dirty || confirmPasswordModel.touched)" placeholder="Confirm new password" class="modern-input">
                <button type="button" class="toggle-pwd-btn" (click)="toggleVisibility('confirm')">
                  {{ showConfirmPassword ? 'Hide' : 'Show' }}
                </button>
              </div>
              <div *ngIf="confirmPasswordModel.invalid && (confirmPasswordModel.dirty || confirmPasswordModel.touched)" class="invalid-feedback-custom">Field is required</div>
          </div>
          
          <div class="form-actions">
            <button type="submit" class="btn-modern-primary" [disabled]="pwdForm.invalid">Update Password</button>
          </div>
      </form>
    </div>
  </div>
</div>
