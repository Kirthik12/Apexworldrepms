<header class="admin-top-header">
  <div class="top-header-tier1">
    <div class="breadcrumb">
      <a routerLink="/admin-dashboard" style="text-decoration:none;"><span class="highlight">Admin Workspace</span></a> / {{ breadcrumb }}
    </div>
    <div class="tier1-actions">
      <div class="top-search-bar">
        <span class="icon">&#128269;</span>
        <input type="text" id="db-search" placeholder="Search...">
      </div>
      
      <!-- Header Actions -->
      <div class="header-actions" style="display: flex; align-items: center; gap: 16px;">
        <!-- Notifications -->
        <a routerLink="/admin-dashboard/notifications" style="text-decoration: none; font-size: 1.2rem; position: relative;" title="Notifications">
          &#128276;
          <span *ngIf="unreadCount > 0" class="unread-badge">{{ unreadCount }}</span>
        </a>
        
        <!-- User Dropdown -->
        <div class="user-dropdown" style="position: relative;">
          <button class="user-dropdown-btn" onclick="this.nextElementSibling.classList.toggle('show')" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#4B3B73"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span class="nav-user-name" style="font-weight: 600; color: #1E3A8A; font-size: 0.95rem;">Admin</span>
          </button>
          
          <div class="user-dropdown-menu" style="position: absolute; right: 0; top: calc(100% + 10px); background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; flex-direction: column; min-width: 180px; z-index: 9999; overflow: hidden;">
            <a routerLink="/admin-dashboard/user-profile" style="padding: 12px 16px; color: #1E293B; text-decoration: none; font-size: 0.85rem; border-bottom: 1px solid #F1F5F9; transition: background 0.2s;" onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background='#fff'">My Profile</a>
            <a routerLink="/admin-dashboard/reset-password" style="padding: 12px 16px; color: #1E293B; text-decoration: none; font-size: 0.85rem; border-bottom: 1px solid #F1F5F9; transition: background 0.2s;" onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background='#fff'">Reset Password</a>
            <a href="#" style="padding: 12px 16px; color: #EF4444; text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: background 0.2s;" onmouseover="this.style.background='#FEF2F2'" onmouseout="this.style.background='#fff'">Logout</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="top-header-tier2" *ngIf="title" [style.display]="actionButtonText ? 'flex' : 'block'" [style.justify-content]="actionButtonText ? 'space-between' : 'flex-start'" [style.align-items]="actionButtonText ? 'center' : 'stretch'">
    <h2 class="page-title">{{ title }}</h2>
    <button *ngIf="actionButtonText" class="btn btn-primary" (click)="onActionClick()" [attr.data-bs-toggle]="actionButtonTarget ? 'modal' : null" [attr.data-bs-target]="actionButtonTarget ? actionButtonTarget : null">{{ actionButtonText }}</button>
  </div>
</header>
