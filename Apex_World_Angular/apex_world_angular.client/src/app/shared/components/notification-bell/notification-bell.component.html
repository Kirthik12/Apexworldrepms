<div class="notification-container">
  <a href="javascript:void(0)" class="notification-bell" title="Notifications" (click)="toggleDropdown($event)">
    &#128276;
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
  </a>

  <div class="notification-dropdown" [class.show]="isDropdownOpen" (click)="$event.stopPropagation()">
    <div class="dropdown-header">
      <h4>Notifications</h4>
      <button class="mark-read-btn" *ngIf="unreadCount > 0" (click)="markAllAsRead($event)">Mark all as read</button>
    </div>

    <div class="dropdown-body">
      <div *ngIf="notifications.length === 0" class="empty-state">
        No recent notifications
      </div>
      
      <div class="notification-item" 
           *ngFor="let n of notifications" 
           [class.unread]="!n.isRead"
           (click)="onNotificationClick(n)">
        <div class="n-icon" [ngClass]="n.category.toLowerCase()">
          <span *ngIf="n.category === 'Booking'">📅</span>
          <span *ngIf="n.category === 'Payment'">💰</span>
          <span *ngIf="n.category === 'General'">📢</span>
        </div>
        <div class="n-content">
          <div class="n-title">{{ n.title }}</div>
          <div class="n-message">{{ n.message }}</div>
          <div class="n-time">{{ n.createdAt | date:'short' }}</div>
        </div>
        <div class="n-dot" *ngIf="!n.isRead"></div>
      </div>
    </div>

    <div class="dropdown-footer">
      <a href="javascript:void(0)" (click)="goToAllNotifications()">View all notifications</a>
    </div>
  </div>
</div>
